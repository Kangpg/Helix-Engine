<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helix 테스트 대시보드</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #10141c; --panel2: #161c26; --card: #131924;
    --border: #232a37; --border2: #2d3648;
    --text: #e8edf4; --muted: #8a94a6; --dim: #5c6678;
    --accent: #4da3ff; --accent2: #1f6feb;
    --ok: #3fb950; --fail: #f85149; --warn: #d29922;
    --cyan: #39c5cf; --violet: #bc8cff; --amber: #e3b341;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; font-size: 14px; }
  button { font-family: inherit; }

  /* ---- 헤더 ---- */
  header { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 52px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .01em; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok);
                box-shadow: 0 0 8px var(--ok); }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }

  /* ---- 레이아웃 ---- */
  .layout { display: grid; grid-template-columns: 236px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 10px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
             margin: 16px 6px 6px; font-weight: 600; }
  aside h2:first-child { margin-top: 6px; }
  .tool-btn { display: block; width: 100%; text-align: left; padding: 9px 10px; margin: 2px 0;
              background: transparent; color: var(--text); border: 1px solid transparent;
              border-radius: 8px; cursor: pointer; font-size: 13px; }
  .tool-btn:hover { background: var(--panel2); }
  .tool-btn.active { background: var(--panel2); border-color: var(--accent2); }
  .quick-btn { display: flex; justify-content: space-between; align-items: baseline; width: 100%;
               padding: 8px 10px; margin: 2px 0; background: transparent; color: var(--text);
               border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .quick-btn:hover { border-color: var(--amber); }
  .quick-btn .d { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .preset-row { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
  .preset-row button.load { flex: 1; text-align: left; padding: 7px 9px; background: transparent;
              border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; font-size: 12px; }
  .preset-row button.load:hover { border-color: var(--accent); }
  .preset-row button.del { background: transparent; border: none; color: var(--dim); cursor: pointer; padding: 4px 6px; }
  .preset-row button.del:hover { color: var(--fail); }

  main { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }

  /* ---- 설정 패널 ---- */
  .config { padding: 14px 20px 16px; border-bottom: 1px solid var(--border); overflow-y: auto;
            max-height: 42vh; background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%); }
  .config .desc { color: var(--muted); margin: 0 0 12px; font-size: 12.5px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.hidden { display: none; }
  .field label { font-size: 11.5px; color: var(--muted); }
  .field .help { font-size: 10.5px; color: var(--dim); }
  .field input, .field select { background: var(--bg); border: 1px solid var(--border); color: var(--text);
              padding: 7px 9px; border-radius: 7px; font-size: 13px; font-family: var(--mono); width: 100%; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field.bool { flex-direction: row; align-items: center; gap: 8px; }
  .field.bool input { width: 15px; height: 15px; }
  .field.bool label { color: var(--text); font-size: 12.5px; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button.primary { background: var(--accent2); color: #fff; border: none; padding: 9px 22px;
              border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.primary:hover { background: var(--accent); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border);
              padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button.ghost:hover { border-color: var(--accent); }
  button.ghost.danger:hover { border-color: var(--fail); color: var(--fail); }
  .cmd-preview { flex: 1; min-width: 220px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
              background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
              white-space: nowrap; overflow-x: auto; }

  /* ---- 런 영역 ---- */
  .run-area { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  .run-tabs { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border);
              background: var(--panel); align-items: center; overflow-x: auto; min-height: 45px; }
  .run-tab { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 8px;
              background: var(--panel2); border: 1px solid var(--border); cursor: pointer;
              font-size: 12px; white-space: nowrap; }
  .run-tab.active { border-color: var(--accent2); }
  .run-tab .st { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .run-tab.running .st { animation: pulse 1s infinite; }
  .run-tab.ok .st { background: var(--ok); }
  .run-tab.fail .st { background: var(--fail); }
  .run-tab .x { color: var(--dim); }
  .run-tab .x:hover { color: var(--fail); }
  @keyframes pulse { 50% { opacity: .25; } }

  .run-body { overflow-y: auto; padding: 14px 18px; }
  .empty { color: var(--dim); padding: 48px; text-align: center; font-size: 13px; }

  /* 메타 행 */
  .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; }
  .badge.running { background: rgba(210,153,34,.15); color: var(--warn); border: 1px solid rgba(210,153,34,.4); }
  .badge.ok { background: rgba(63,185,80,.12); color: var(--ok); border: 1px solid rgba(63,185,80,.4); }
  .badge.fail { background: rgba(248,81,73,.12); color: var(--fail); border: 1px solid rgba(248,81,73,.4); }
  .meta-row .name { font-weight: 700; font-size: 14px; }
  .meta-row .cmd { color: var(--dim); font-family: var(--mono); font-size: 11px;
                   max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta-row .elapsed { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: auto; }
  .progress { height: 4px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: -4px 0 12px; }
  .progress .bar { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--cyan));
                   width: 0%; transition: width .5s linear; }

  /* 통계 카드 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .card .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .card .v { font-size: 20px; font-weight: 700; font-family: var(--mono); margin-top: 3px;
             font-variant-numeric: tabular-nums; }
  .card .u { font-size: 10.5px; color: var(--dim); margin-left: 2px; font-weight: 400; }
  .card.c-thr .v { color: var(--cyan); }
  .card.c-lat .v { color: var(--violet); }
  .card.c-err .v { color: var(--ok); }
  .card.c-err.bad .v { color: var(--fail); }

  /* 차트 */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  @media (max-width: 1100px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 6px; }
  .chart-card .title { display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--muted);
                       margin-bottom: 4px; }
  .chart-card .legend { display: flex; gap: 10px; margin-left: auto; font-size: 10.5px; }
  .chart-card .legend span::before { content: "●"; margin-right: 3px; }
  .chart-card canvas { width: 100%; height: 150px; display: block; }

  /* 콘솔 */
  .console-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .console-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
                  border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
  .console-head label { display: flex; align-items: center; gap: 5px; cursor: pointer; margin-left: auto; }
  .console { font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 10px 14px;
             max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .console .l-ok { color: var(--ok); }
  .console .l-fail { color: var(--fail); }
  .console .l-warn { color: var(--warn); }
  .console .l-meta { color: var(--dim); }
  .console .l-stat { color: var(--dim); display: none; }
  .console.show-raw .l-stat { display: block; }

  /* 비교 테이블 */
  .cmp-wrap { overflow-x: auto; }
  table.cmp { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.cmp th, table.cmp td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border);
                               font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.cmp th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                 position: sticky; top: 0; background: var(--bg); }
  table.cmp td:first-child, table.cmp th:first-child { text-align: left; }
  table.cmp td.num-hi { color: var(--cyan); font-weight: 700; }
  table.cmp tr:hover td { background: var(--panel2); }

  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel2); border: 1px solid var(--border2);
           padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none;
           box-shadow: 0 6px 24px rgba(0,0,0,.4); z-index: 10; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Helix 테스트 대시보드</h1>
  <span class="sub">부하 생성 · 실시간 모니터링</span>
  <span class="spacer"></span>
  <span class="sub" id="runCount"></span>
</header>

<div class="layout">
  <aside>
    <h2>도구</h2>
    <div id="toolList"></div>
    <h2>빠른 부하</h2>
    <div id="quickList"></div>
    <h2>프리셋</h2>
    <div id="presetList"></div>
  </aside>

  <main>
    <div class="config">
      <p class="desc" id="toolDesc"></p>
      <div class="grid" id="formGrid"></div>
      <div class="actions">
        <button class="primary" id="runBtn">▶ 실행</button>
        <button class="ghost" id="saveBtn">프리셋 저장</button>
        <button class="ghost" id="resetBtn">기본값</button>
        <div class="cmd-preview" id="cmdPreview"></div>
      </div>
    </div>

    <div class="run-area">
      <div class="run-tabs" id="runTabs"></div>
      <div class="run-body" id="runBody">
        <div class="empty">도구를 선택하고 ▶ 실행하면 실시간 통계·차트·로그가 여기에 표시됩니다.</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
let TOOLS = [];
let current = null;           // 선택된 도구
let activeView = null;        // run_id | "compare" | null
const runs = {};              // run_id -> {tool_name, cmd, status, lines[], stats[], sum, started, cfg, es}
const completed = [];         // 종료된 런의 @SUM 기록(비교 테이블)

const $ = (id) => document.getElementById(id);
const fmt = (n) => n >= 100000 ? (n/1000).toFixed(0) + "k" : n >= 10000 ? (n/1000).toFixed(1) + "k" : Number(n).toLocaleString();
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show");
                         setTimeout(() => t.classList.remove("show"), 1800); };

async function boot() {
  const data = await (await fetch("/api/tools")).json();
  TOOLS = data.tools || [];
  renderToolList();
  await renderPresets();
  if (TOOLS.length) selectTool(TOOLS[0].id);
}

/* ---------- 사이드바 ---------- */
function renderToolList() {
  $("toolList").innerHTML = "";
  TOOLS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tool-btn" + (current && current.id === t.id ? " active" : "");
    b.textContent = t.name;
    b.onclick = () => selectTool(t.id);
    $("toolList").appendChild(b);
  });
  renderQuick();
}

function renderQuick() {
  const box = $("quickList");
  box.innerHTML = "";
  const t = TOOLS.find(t => (t.quick || []).length) || null;
  if (!t) { box.innerHTML = `<div style="color:var(--dim);font-size:11.5px;padding:4px 6px">없음</div>`; return; }
  t.quick.forEach(q => {
    const b = document.createElement("button");
    b.className = "quick-btn";
    b.innerHTML = `<span>${q.name}</span><span class="d">${q.desc}</span>`;
    b.title = "클릭: 폼에 적용 (host/port는 유지)";
    b.onclick = () => {
      const keep = current && current.id === t.id ? collectValues() : {};
      selectTool(t.id, Object.assign({}, keep, q.values));
      toast("적용: " + q.name);
    };
    box.appendChild(b);
  });
}

async function renderPresets() {
  const presets = await (await fetch("/api/presets")).json();
  const box = $("presetList");
  box.innerHTML = presets.length ? "" : `<div style="color:var(--dim);font-size:11.5px;padding:4px 6px">저장된 프리셋 없음</div>`;
  presets.forEach(p => {
    const row = document.createElement("div");
    row.className = "preset-row";
    row.innerHTML = `<button class="load">${p.name} <span style="color:var(--dim)">· ${p.tool}</span></button>
                     <button class="del" title="삭제">✕</button>`;
    row.querySelector(".load").onclick = () => selectTool(p.tool, p.values);
    row.querySelector(".del").onclick = async () => {
      await fetch("/api/presets?name=" + encodeURIComponent(p.name), { method: "DELETE" });
      await renderPresets();
    };
    box.appendChild(row);
  });
}

/* ---------- 설정 폼 ---------- */
function selectTool(id, values) {
  current = TOOLS.find(t => t.id === id);
  if (!current) return;
  renderToolList();
  $("toolDesc").textContent = current.desc || "";
  renderForm(values);
  updatePreview();
}

function renderForm(values) {
  const g = $("formGrid");
  g.innerHTML = "";
  (current.params || []).forEach(p => {
    const val = values && (p.name in values) ? values[p.name] : p.default;
    const f = document.createElement("div");
    f.className = "field" + (p.type === "bool" ? " bool" : "");
    if (p.modes) f.dataset.modes = p.modes.join(",");
    let control;
    if (p.type === "bool") {
      control = `<input type="checkbox" id="f_${p.name}" ${val ? "checked" : ""}>
                 <label for="f_${p.name}">${p.flag || p.name}</label>`;
    } else if (p.type === "select") {
      const opts = (p.options || []).map(o => `<option ${String(o) === String(val) ? "selected" : ""}>${o}</option>`).join("");
      control = `<label>${p.name}</label><select id="f_${p.name}">${opts}</select>`;
    } else {
      control = `<label>${p.name}</label><input type="text" id="f_${p.name}" value="${val ?? ""}">`;
    }
    const help = p.help ? `<span class="help">${p.help}</span>` : "";
    f.innerHTML = control + help;
    g.appendChild(f);
  });
  g.querySelectorAll("input,select").forEach(el => el.addEventListener("input", () => {
    applyModeVisibility(); updatePreview();
  }));
  applyModeVisibility();
}

function applyModeVisibility() {
  const modeEl = $("f_mode");
  const mode = modeEl ? modeEl.value : null;
  document.querySelectorAll("#formGrid .field[data-modes]").forEach(f => {
    f.classList.toggle("hidden", mode !== null && !f.dataset.modes.split(",").includes(mode));
  });
}

function collectValues() {
  const v = {};
  (current.params || []).forEach(p => {
    const el = $("f_" + p.name);
    if (!el || el.closest(".field").classList.contains("hidden")) return;
    v[p.name] = p.type === "bool" ? el.checked : el.value;
  });
  return v;
}

function buildCmdString(values) {
  const pos = [], flags = [];
  (current.params || []).forEach(p => {
    if (!(p.name in values)) return;
    const val = values[p.name];
    if (p.type === "bool") { if (val) flags.push(p.flag); return; }
    if ((val === "" || val == null) && !p.positional) return;
    if (p.positional) pos.push(val);
    else flags.push(p.flag, val);
  });
  return ["python", current.script, ...pos, ...flags].join(" ");
}

function updatePreview() {
  if (!current) return;
  $("cmdPreview").textContent = buildCmdString(collectValues());
}

$("resetBtn").onclick = () => selectTool(current.id);
$("saveBtn").onclick = async () => {
  const name = prompt("프리셋 이름:");
  if (!name) return;
  await fetch("/api/presets", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, tool: current.id, values: collectValues() })
  });
  await renderPresets();
  toast("저장됨: " + name);
};

$("runBtn").onclick = async () => {
  const values = collectValues();
  const res = await (await fetch("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tool: current.id, values })
  })).json();
  if (res.error) { toast("실행 실패: " + res.error); return; }
  const cfg = { mode: values.mode || current.id, duration: parseFloat(values.duration) || 0 };
  startRun(res.run_id, current.name, res.cmd, cfg);
};

/* ---------- 런/스트리밍 ---------- */
function startRun(runId, toolName, cmd, cfg) {
  runs[runId] = { tool_name: toolName, cmd, status: "running", lines: [], stats: [],
                  sum: null, started: Date.now(), cfg };
  const es = new EventSource("/api/stream/" + runId);
  runs[runId].es = es;
  es.onmessage = (e) => {
    const { line } = JSON.parse(e.data);
    handleLine(runId, line);
  };
  es.addEventListener("end", (e) => {
    const { code } = JSON.parse(e.data);
    const r = runs[runId];
    r.status = code === 0 ? "ok" : "fail";
    r.lines.push({ text: `─── 종료 코드 ${code} (${code === 0 ? "PASS" : "FAIL"}) ───`, cls: "meta" });
    es.close();
    renderTabs();
    if (activeView === runId) showRun(runId);
    if (activeView === "compare") showCompare();
  });
  showRun(runId);
  renderTabs();
}

function handleLine(runId, line) {
  const r = runs[runId];
  if (line.startsWith("@STAT ")) {
    try {
      r.stats.push(JSON.parse(line.slice(6)));
      if (r.stats.length > 600) r.stats.shift();   // 10분 창
    } catch (_) {}
    r.lines.push({ text: line, cls: "stat" });
    if (activeView === runId) updateLive(runId);
  } else if (line.startsWith("@SUM ")) {
    try {
      r.sum = JSON.parse(line.slice(5));
      completed.push(Object.assign({ _tool: r.tool_name, _at: new Date().toLocaleTimeString() }, r.sum));
      if (completed.length > 60) completed.shift();
    } catch (_) {}
    r.lines.push({ text: line, cls: "stat" });
    if (activeView === runId) updateLive(runId);
  } else {
    r.lines.push({ text: line, cls: classify(line) });
    if (r.lines.length > 4000) r.lines.shift();
    if (activeView === runId) appendConsoleLine(r.lines[r.lines.length - 1]);
  }
}

function classify(line) {
  const s = line.toUpperCase();
  if (s.includes("PASS") || s.includes(" OK") || s.includes("성공")) return "ok";
  if (s.includes("FAIL") || s.includes("ERROR") || s.includes("실패") || s.includes("TIMEOUT")) return "fail";
  if (s.includes("WARN") || s.includes("경고")) return "warn";
  if (line.startsWith("─") || line.startsWith("[") || line.startsWith("=")) return "meta";
  return "";
}

/* ---------- 탭 ---------- */
function renderTabs() {
  const box = $("runTabs");
  box.innerHTML = "";
  const ids = Object.keys(runs).reverse();
  ids.forEach(id => {
    const r = runs[id];
    const t = document.createElement("div");
    t.className = "run-tab " + r.status + (activeView === id ? " active" : "");
    t.innerHTML = `<span class="st"></span> ${r.tool_name} <span class="x" title="닫기">✕</span>`;
    t.onclick = (ev) => {
      if (ev.target.classList.contains("x")) {
        if (r.es) r.es.close();
        delete runs[id];
        if (activeView === id) { activeView = null; $("runBody").innerHTML = `<div class="empty">런을 선택하세요.</div>`; }
        renderTabs();
      } else showRun(id);
    };
    box.appendChild(t);
  });
  // 비교 탭
  const cmp = document.createElement("div");
  cmp.className = "run-tab" + (activeView === "compare" ? " active" : "");
  cmp.innerHTML = `≡ 런 비교 (${completed.length})`;
  cmp.onclick = showCompare;
  box.appendChild(cmp);

  const running = Object.keys(runs).filter(id => runs[id].status === "running");
  $("runCount").textContent = running.length ? `실행 중 ${running.length}` : "";
  // 중지 버튼
  if (activeView && runs[activeView] && runs[activeView].status === "running") {
    const stop = document.createElement("button");
    stop.className = "ghost danger"; stop.textContent = "■ 중지"; stop.style.marginLeft = "auto";
    stop.onclick = () => fetch("/api/stop/" + activeView, { method: "POST" });
    box.appendChild(stop);
  }
}

/* ---------- 런 상세 뷰 ---------- */
function showRun(runId) {
  activeView = runId;
  const r = runs[runId];
  const isLoad = r.cfg && r.cfg.mode === "load";
  const body = $("runBody");
  body.innerHTML = `
    <div class="meta-row">
      <span class="badge ${r.status}" id="rvBadge">${r.status === "running" ? "RUNNING" : r.status.toUpperCase()}</span>
      <span class="name">${r.tool_name}</span>
      <span class="cmd" title="${r.cmd || ""}">${r.cmd || ""}</span>
      <span class="elapsed" id="rvElapsed"></span>
    </div>
    ${isLoad && r.cfg.duration > 0 ? `<div class="progress"><div class="bar" id="rvProg"></div></div>` : ""}
    <div class="cards" id="rvCards"></div>
    ${isLoad ? `
    <div class="charts">
      <div class="chart-card">
        <div class="title">처리량
          <div class="legend"><span style="color:var(--cyan)">msg/s</span></div>
        </div>
        <canvas id="chThr"></canvas>
      </div>
      <div class="chart-card">
        <div class="title">지연 (ms)
          <div class="legend">
            <span style="color:var(--violet)">p50</span>
            <span style="color:var(--amber)">p95</span>
            <span style="color:var(--fail)">p99</span>
          </div>
        </div>
        <canvas id="chLat"></canvas>
      </div>
    </div>` : ""}
    <div class="console-card">
      <div class="console-head">콘솔
        <label><input type="checkbox" id="rvRaw"> 원시 @STAT/@SUM 표시</label>
      </div>
      <div class="console" id="rvConsole"></div>
    </div>`;
  $("rvRaw").onchange = (e) => $("rvConsole").classList.toggle("show-raw", e.target.checked);
  r.lines.forEach(appendConsoleLine);
  updateLive(runId);
  renderTabs();
}

function cardHtml(cls, k, v, u) {
  return `<div class="card ${cls}"><div class="k">${k}</div><div class="v">${v}<span class="u">${u || ""}</span></div></div>`;
}

function updateLive(runId) {
  const r = runs[runId];
  if (!r || activeView !== runId) return;
  const el = $("rvCards");
  if (!el) return;

  const last = r.stats.length ? r.stats[r.stats.length - 1] : null;
  const s = r.sum;
  const src = s || last;   // 종료 후엔 최종 요약 우선
  const errs = src ? (src.mm || 0) + (src.to || 0) + (src.ce || 0) : 0;

  if (src) {
    el.innerHTML =
      cardHtml("c-thr", s ? "평균 처리량" : "처리량", fmt(src.mps || 0), "msg/s") +
      cardHtml("c-thr", "대역폭", (src.mbps || 0).toFixed(2), "MB/s") +
      (s ? cardHtml("", "라운드트립", fmt(s.roundtrips || 0), "") :
           cardHtml("", "활성 연결", fmt(last.active || 0), "")) +
      cardHtml("c-lat", "p50", (src.p50 || 0).toFixed(2), "ms") +
      cardHtml("c-lat", "p95", (src.p95 || 0).toFixed(2), "ms") +
      cardHtml("c-lat", "p99", (src.p99 || 0).toFixed(2), "ms") +
      cardHtml("c-err" + (errs ? " bad" : ""), "에러", fmt(errs),
               errs ? ` mm${src.mm}/to${src.to}/ce${src.ce}` : "");
  } else {
    el.innerHTML = `<div class="card"><div class="k">대기</div><div class="v" style="font-size:13px;color:var(--muted)">첫 통계 수신 대기 중…</div></div>`;
  }

  // 배지/경과
  const badge = $("rvBadge");
  if (badge) { badge.className = "badge " + r.status;
               badge.textContent = r.status === "running" ? "RUNNING" : (r.status === "ok" ? "PASS" : "FAIL"); }
  tick(runId);

  // 차트
  if (r.stats.length) {
    const thr = $("chThr"), lat = $("chLat");
    if (thr) drawChart(thr, r.stats, [{ key: "mps", color: css("--cyan"), fill: true }]);
    if (lat) drawChart(lat, r.stats, [
      { key: "p50", color: css("--violet") },
      { key: "p95", color: css("--amber") },
      { key: "p99", color: css("--fail") }]);
  }
}

function tick(runId) {
  const r = runs[runId];
  if (!r || activeView !== runId) return;
  const el = $("rvElapsed");
  if (!el) return;
  const sec = r.status === "running" ? (Date.now() - r.started) / 1000
            : (r.sum ? r.sum.elapsed : (Date.now() - r.started) / 1000);
  el.textContent = sec >= 60 ? `${Math.floor(sec / 60)}m ${Math.floor(sec % 60)}s` : `${sec.toFixed(0)}s`;
  const prog = $("rvProg");
  if (prog && r.cfg.duration > 0) {
    const p = r.status === "running" ? Math.min(100, sec / r.cfg.duration * 100) : 100;
    prog.style.width = p + "%";
  }
}
setInterval(() => { if (activeView && runs[activeView]) tick(activeView); }, 500);

function appendConsoleLine(entry) {
  const c = $("rvConsole");
  if (!c) return;
  const div = document.createElement("div");
  div.className = entry.cls ? "l-" + entry.cls : "";
  div.textContent = entry.text;
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 60;
  c.appendChild(div);
  while (c.childNodes.length > 3000) c.removeChild(c.firstChild);
  if (atBottom) c.scrollTop = c.scrollHeight;
}

/* ---------- 비교 뷰 ---------- */
function showCompare() {
  activeView = "compare";
  const body = $("runBody");
  if (!completed.length) {
    body.innerHTML = `<div class="empty">완료된 런이 없습니다. 런이 끝나면 최종 요약(@SUM)이 여기에 쌓입니다.</div>`;
    renderTabs(); return;
  }
  const bestMps = Math.max(...completed.map(s => s.mps || 0));
  const rows = completed.slice().reverse().map(s => {
    const errs = (s.mm || 0) + (s.to || 0) + (s.ce || 0);
    return `<tr>
      <td>${s._at || ""} · ${s.mode || s._tool}${s.workers > 1 ? ` <span style="color:var(--dim)">×${s.workers}w</span>` : ""}</td>
      <td>${s.target || ""}</td>
      <td>${fmt(s.clients || 0)}</td>
      <td>${(s.elapsed || 0).toFixed(1)}s</td>
      <td class="${(s.mps || 0) === bestMps ? "num-hi" : ""}">${fmt(s.mps || 0)}</td>
      <td>${(s.mbps || 0).toFixed(2)}</td>
      <td>${(s.p50 || 0).toFixed(2)}</td>
      <td>${(s.p95 || 0).toFixed(2)}</td>
      <td>${(s.p99 || 0).toFixed(2)}</td>
      <td>${(s.max || 0).toFixed(1)}</td>
      <td style="color:${errs ? "var(--fail)" : "var(--ok)"}">${errs}</td>
      <td><span class="badge ${s.pass ? "ok" : "fail"}">${s.pass ? "PASS" : "FAIL"}</span></td>
    </tr>`;
  }).join("");
  body.innerHTML = `
    <div class="meta-row"><span class="name">런 비교</span>
      <span style="color:var(--dim);font-size:12px">완료된 런의 최종 요약 · 최고 처리량 강조</span>
      <button class="ghost danger" style="margin-left:auto" id="cmpClear">기록 지우기</button></div>
    <div class="cmp-wrap"><table class="cmp">
      <thead><tr><th>런</th><th>타깃</th><th>clients</th><th>시간</th><th>msg/s</th><th>MB/s</th>
      <th>p50</th><th>p95</th><th>p99</th><th>max</th><th>에러</th><th>결과</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  $("cmpClear").onclick = () => { completed.length = 0; showCompare(); };
  renderTabs();
}

/* ---------- 캔버스 차트 ---------- */
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawChart(canvas, data, series) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const pts = data.slice(-180);          // 최근 3분 창
  if (pts.length < 2) return;
  const padL = 40, padR = 8, padT = 8, padB = 18;
  const iw = w - padL - padR, ih = h - padT - padB;

  let ymax = 0;
  series.forEach(s => pts.forEach(p => { const v = p[s.key] || 0; if (v > ymax) ymax = v; }));
  ymax = ymax <= 0 ? 1 : ymax * 1.12;

  // 그리드 + y 라벨
  ctx.strokeStyle = css("--border"); ctx.fillStyle = css("--dim");
  ctx.font = "10px " + css("--mono"); ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = padT + ih * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    const val = ymax * (1 - i / 3);
    ctx.textAlign = "right";
    ctx.fillText(val >= 1000 ? (val / 1000).toFixed(1) + "k" : val >= 10 ? val.toFixed(0) : val.toFixed(1),
                 padL - 5, y + 3);
  }
  // x 라벨(t초)
  ctx.textAlign = "center";
  const t0 = pts[0].t || 0, t1 = pts[pts.length - 1].t || pts.length;
  [0, 0.5, 1].forEach(f => {
    const t = t0 + (t1 - t0) * f;
    ctx.fillText(t.toFixed(0) + "s", padL + iw * f, h - 5);
  });

  const X = (i) => padL + iw * (i / (pts.length - 1));
  const Y = (v) => padT + ih * (1 - Math.min(v, ymax) / ymax);

  series.forEach(s => {
    ctx.beginPath();
    pts.forEach((p, i) => { const x = X(i), y = Y(p[s.key] || 0); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.8; ctx.lineJoin = "round"; ctx.stroke();
    if (s.fill) {
      ctx.lineTo(X(pts.length - 1), padT + ih); ctx.lineTo(X(0), padT + ih); ctx.closePath();
      ctx.fillStyle = s.color + "22"; ctx.fill();
    }
  });
}

boot();

</script>
</body>
</html>
